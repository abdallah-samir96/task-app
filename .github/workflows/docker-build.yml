name: Build and Push Task Service APP to docker Hub As an image

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java and configure Maven
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build application
        run: mvn clean package -DskipTests

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task-service:latest .

      # 6. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/task-service:latest

  after-build:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: after build and push steps
        run: echo "hello Data ${{secrets.DOCKERHUB_USERNAME}}"

